<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>成語拆字魔方 - 366每日挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');

        :root {
            --bg-color: #0b1120; 
            --text-color: #f8fafc;
            --dice-bg: rgba(15, 23, 42, 0.85);
            --dice-border: #334155;
            --accent: #10b981;
            --highlight: #38bdf8;
            --dice-size: clamp(64px, min(24vw, 22vh), 120px);
        }

        body {
            font-family: "Noto Serif TC", "PMingLiU", serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; min-height: 100dvh; margin: 0; padding: 15px 10px;
            overflow-x: hidden; touch-action: pan-y; user-select: none;
            background-image: radial-gradient(circle at 50% -10%, #1e3a8a, var(--bg-color) 80%);
        }

        /* 全螢幕模式下，讓內容維持置中並填滿畫面 */
        html:fullscreen body, html:-webkit-full-screen body {
            min-height: 100vh; justify-content: center;
        }

        /* 3D 場景與骰子設定：使用 clamp() 依螢幕寬高自適應縮放 */
        .scene {
            width: var(--dice-size); height: var(--dice-size);
            perspective: 1000px; margin: clamp(6px, 2vw, 15px); display: inline-block;
        }

        .cube {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(20deg);
            cursor: grab;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .cube:active { cursor: grabbing; }

        .face {
            position: absolute; width: var(--dice-size); height: var(--dice-size);
            background: var(--dice-bg); border: 1px solid var(--dice-border);
            box-shadow: inset 0 0 25px rgba(56, 189, 248, 0.1), 0 8px 20px rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
            font-size: calc(var(--dice-size) * 0.42); font-weight: 900; color: var(--highlight);
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
            border-radius: 16px; backdrop-filter: blur(8px);
        }

        .front  { transform: rotateY(  0deg) translateZ(calc(var(--dice-size) / 2)); }
        .right  { transform: rotateY( 90deg) translateZ(calc(var(--dice-size) / 2)); }
        .back   { transform: rotateY(180deg) translateZ(calc(var(--dice-size) / 2)); }
        .left   { transform: rotateY(-90deg) translateZ(calc(var(--dice-size) / 2)); }
        .top    { transform: rotateX( 90deg) translateZ(calc(var(--dice-size) / 2)); }
        .bottom { transform: rotateX(-90deg) translateZ(calc(var(--dice-size) / 2)); }

        .input-box {
            background: rgba(15, 23, 42, 0.6); border: 2px solid var(--dice-border);
            color: white; text-align: center; font-size: 26px; letter-spacing: 6px;
            outline: none; border-radius: 12px; padding: 10px; width: 220px;
            transition: all 0.3s ease; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .input-box:focus { border-color: var(--highlight); box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }

        .input-row-group { display: flex; align-items: center; gap: 8px; }
        #zy-toggle-btn {
            background: rgba(56, 189, 248, 0.12); border: 2px solid var(--dice-border);
            color: var(--highlight); font-size: 20px; width: 52px; height: 52px;
            border-radius: 12px; cursor: pointer; transition: 0.2s; flex-shrink: 0;
        }
        #zy-toggle-btn:hover, #zy-toggle-btn:active { background: rgba(56, 189, 248, 0.25); transform: scale(0.96); }

        .glass-panel {
            background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px; padding: clamp(14px, 4vw, 25px); max-width: 550px; width: 100%;
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); backdrop-filter: blur(15px);
        }

        /* 提示解鎖區塊 */
        .hint-container {
            position: relative; min-height: 80px; background: rgba(0,0,0,0.3);
            border-radius: 12px; border: 1px dashed rgba(255,255,255,0.2);
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; padding: 15px;
        }
        .hint-container:hover { border-color: var(--highlight); background: rgba(0,0,0,0.4); }
        .hint-overlay {
            position: absolute; inset: 0; backdrop-filter: blur(8px); background: rgba(15, 23, 42, 0.85);
            display: flex; align-items: center; justify-content: center; z-index: 10;
            font-weight: bold; color: #94a3b8; transition: opacity 0.5s ease-in-out;
        }
        .hint-container.unlocked .hint-overlay { opacity: 0; pointer-events: none; }
        
        #audio-ctrl {
            position: absolute; top: 15px; right: 15px;
            background: rgba(255,255,255,0.05); border-radius: 50%; width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s;
        }
        #audio-ctrl:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }

        /* 注音小鍵盤 */
        .zy-keypad {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
            background: rgba(11, 17, 32, 0.97); border-top: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.6); backdrop-filter: blur(12px);
            padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px)) 10px;
            transform: translateY(0); transition: transform 0.3s ease;
        }
        .zy-keypad.hidden { transform: translateY(110%); pointer-events: none; }

        .zy-candidates {
            display: flex; align-items: center; gap: 8px; overflow-x: auto;
            min-height: 44px; padding: 4px 6px; margin-bottom: 8px;
            background: rgba(255,255,255,0.04); border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .zy-buffer {
            color: var(--highlight); font-weight: 900; font-size: 18px;
            letter-spacing: 2px; white-space: nowrap; padding: 0 6px;
        }
        .zy-cand {
            flex: 0 0 auto; background: rgba(56, 189, 248, 0.15); color: #fff;
            border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 8px;
            font-size: 20px; font-weight: 700; padding: 6px 12px; cursor: pointer;
            transition: 0.15s;
        }
        .zy-cand:active { background: var(--highlight); color: #0b1120; transform: scale(0.95); }

        .zy-grid {
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px;
        }
        .zy-key {
            background: rgba(255,255,255,0.06); color: var(--text-color);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            font-size: 17px; font-weight: 700; padding: 10px 0; cursor: pointer;
            transition: 0.15s;
        }
        .zy-key:active { background: var(--highlight); color: #0b1120; transform: scale(0.93); }
        .zy-key.zy-tone { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.4); }
        .zy-key.zy-tone:active { background: var(--accent); color: #0b1120; }

        .zy-toolbar {
            display: flex; gap: 6px; margin-top: 8px;
        }
        .zy-fn-btn {
            flex: 1; background: rgba(255,255,255,0.05); color: #cbd5e1;
            border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
            font-size: 13px; font-weight: 700; padding: 10px 4px; cursor: pointer;
        }
        .zy-fn-btn:active { background: rgba(255,255,255,0.15); }

        .app-footer {
            margin-top: 28px; margin-bottom: 10px; text-align: center;
            color: #64748b; font-size: 12px; letter-spacing: 1px;
        }

        /* 初始頁面 */
        .start-screen {
            position: fixed; inset: 0; z-index: 200;
            background: radial-gradient(circle at 50% 20%, #1e3a8a, var(--bg-color) 75%);
            display: flex; align-items: center; justify-content: center;
            padding: 20px; transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .start-screen.start-hide { opacity: 0; visibility: hidden; pointer-events: none; }
        .start-card {
            background: rgba(30, 41, 59, 0.55); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px; padding: 36px 28px; max-width: 420px; width: 100%;
            text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.6); backdrop-filter: blur(18px);
        }
        .start-title {
            font-size: clamp(24px, 7vw, 32px); font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(90deg, #22d3ee, #60a5fa);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 6px;
        }
        .start-sub { color: #93c5fd; font-size: 13px; margin-bottom: 24px; letter-spacing: 1px; }
        .start-settings { display: flex; flex-direction: column; gap: 14px; margin-bottom: 26px; }
        .setting-row {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            font-size: 14px; color: #e2e8f0;
        }
        .setting-row input[type="range"] { flex: 1; margin: 0 10px; accent-color: var(--highlight); }
        .volume-label { min-width: 40px; text-align: right; color: #94a3b8; font-size: 12px; }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle {
            position: absolute; cursor: pointer; inset: 0; background: rgba(255,255,255,0.15);
            border-radius: 24px; transition: 0.3s;
        }
        .slider-toggle::before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background: #fff; border-radius: 50%; transition: 0.3s;
        }
        .switch input:checked + .slider-toggle { background: var(--highlight); }
        .switch input:checked + .slider-toggle::before { transform: translateX(20px); }

        .start-btn {
            width: 100%; background: linear-gradient(90deg, #0891b2, #2563eb); color: #fff;
            font-weight: 900; font-size: 18px; padding: 16px 0; border-radius: 14px; border: none;
            cursor: pointer; letter-spacing: 3px; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
            transition: 0.2s;
        }
        .start-btn:active { transform: scale(0.97); }
        .start-footer { margin-top: 18px; color: #64748b; font-size: 11px; letter-spacing: 1px; }

        /* 遊戲內設定面板 */
        #settings-ctrl {
            position: absolute; top: 15px; right: 67px;
            background: rgba(255,255,255,0.05); border-radius: 50%; width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; z-index: 60;
        }
        #settings-ctrl:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
        .settings-panel {
            position: absolute; top: 64px; right: 15px; z-index: 60; width: 250px;
            background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; padding: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px); display: flex; flex-direction: column; gap: 14px;
            transition: 0.25s;
        }
        .settings-panel.hidden { opacity: 0; visibility: hidden; transform: translateY(-8px); pointer-events: none; }

        /* 記錄榜／月曆彈窗 */
        .calendar-modal {
            position: fixed; inset: 0; z-index: 150;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; padding: 16px;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .calendar-modal.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .calendar-card {
            background: rgba(17, 24, 39, 0.97); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px; padding: 18px; max-width: 360px; width: 100%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }
        .calendar-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
        }
        .calendar-header button {
            background: rgba(255,255,255,0.08); border: none; color: #e2e8f0;
            width: 32px; height: 32px; border-radius: 8px; font-size: 15px; cursor: pointer;
        }
        .calendar-header button:active { background: rgba(255,255,255,0.2); }
        .calendar-close { background: rgba(244,63,94,0.15) !important; color: #fb7185 !important; }
        #calendar-month-label { font-size: 17px; font-weight: 900; color: var(--highlight); }
        .calendar-weekdays {
            display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
            font-size: 11px; color: #64748b; margin-bottom: 4px;
        }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .cal-day {
            aspect-ratio: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            color: #cbd5e1; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer;
            transition: 0.15s; display: flex; align-items: center; justify-content: center;
        }
        .cal-day:active { transform: scale(0.9); }
        .cal-day.done {
            background: rgba(16, 185, 129, 0.25); border-color: rgba(16, 185, 129, 0.7);
            color: #6ee7b7; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        .cal-day.today { border-color: var(--highlight); box-shadow: 0 0 0 2px rgba(56,189,248,0.5) inset; }
        .calendar-legend {
            display: flex; gap: 14px; justify-content: center; margin-top: 12px;
            font-size: 11px; color: #94a3b8;
        }
        .legend-dot {
            display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px;
            vertical-align: middle;
        }
        .legend-dot.done { background: rgba(16, 185, 129, 0.7); }
        .legend-dot.today { border: 2px solid var(--highlight); }
        .calendar-progress { text-align: center; margin-top: 10px; color: #93c5fd; font-size: 12px; font-weight: 700; }

    </style>
</head>
<body>

    <!-- 初始頁面 -->
    <div id="start-screen" class="start-screen">
        <div class="start-card">
            <h1 class="start-title">成語拆字魔方</h1>
            <p class="start-sub">366 每日挑戰・拆解真實漢字部件</p>

            <div class="start-settings">
                <div class="setting-row">
                    <span>🔊 音量</span>
                    <input type="range" class="volume-slider" min="0" max="100" value="70" oninput="applyVolume(this.value)">
                    <span class="volume-label">70%</span>
                </div>
                <div class="setting-row">
                    <span>🎵 背景音樂</span>
                    <label class="switch"><input type="checkbox" class="bgm-toggle" checked onchange="toggleBgm(this.checked)"><span class="slider-toggle"></span></label>
                </div>
                <div class="setting-row">
                    <span>🔔 遊戲音效</span>
                    <label class="switch"><input type="checkbox" class="sfx-toggle" checked onchange="toggleSfx(this.checked)"><span class="slider-toggle"></span></label>
                </div>
            </div>

            <button id="start-btn" class="start-btn">🎮 開始遊戲</button>
            <p class="start-footer">作者：郭柏宏 老師　｜　版本：20260909</p>
        </div>
    </div>

    <div id="audio-ctrl" title="開關音樂與音效">🔇</div>
    <div id="settings-ctrl" title="遊戲設定">⚙️</div>
    <div id="settings-panel" class="settings-panel hidden">
        <div class="setting-row">
            <span>🔊 音量</span>
            <input type="range" class="volume-slider" min="0" max="100" value="70" oninput="applyVolume(this.value)">
            <span class="volume-label">70%</span>
        </div>
        <div class="setting-row">
            <span>🎵 背景音樂</span>
            <label class="switch"><input type="checkbox" class="bgm-toggle" checked onchange="toggleBgm(this.checked)"><span class="slider-toggle"></span></label>
        </div>
        <div class="setting-row">
            <span>🔔 遊戲音效</span>
            <label class="switch"><input type="checkbox" class="sfx-toggle" checked onchange="toggleSfx(this.checked)"><span class="slider-toggle"></span></label>
        </div>
        <button class="zy-fn-btn" onclick="toggleFullscreen()">
            <span class="fullscreen-btn-label">🖥️ 進入全螢幕</span>
        </button>
    </div>

    <div class="text-center mb-4 mt-2">
        <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400 mb-2 tracking-wide">成語拆字魔方</h1>
        <div class="flex items-center justify-center gap-2 flex-wrap">
            <span id="mode-badge" class="bg-blue-600 text-white text-xs px-3 py-1 rounded-full font-bold shadow-lg shadow-blue-500/30">📅 本日挑戰</span>
            <span id="day-text" class="text-blue-200 text-sm font-bold tracking-wider">第 -- 題</span>
            <span id="today-date" class="text-gray-400 text-xs">🗓 今天 --月--日</span>
            <button id="record-btn" type="button" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 text-xs px-3 py-1 rounded-full font-bold border border-amber-400/30 transition-all">🏆 記錄榜</button>
        </div>
    </div>

    <!-- 3D 骰子區塊 -->
    <div class="flex justify-center gap-6 mb-8 mt-4">
        <div class="scene">
            <div class="cube" id="cube1">
                <div class="face front"></div><div class="face right"></div><div class="face back"></div>
                <div class="face left"></div><div class="face top"></div><div class="face bottom"></div>
            </div>
        </div>
        <div class="scene">
            <div class="cube" id="cube2">
                <div class="face front"></div><div class="face right"></div><div class="face back"></div>
                <div class="face left"></div><div class="face top"></div><div class="face bottom"></div>
            </div>
        </div>
    </div>

    <!-- 遊戲互動區塊 -->
    <div class="glass-panel">
        
        <!-- 隱藏式提示區 -->
        <div class="mb-6">
            <p class="text-blue-300 font-bold mb-2 text-sm tracking-widest">【釋義提示】</p>
            <div id="hint-box" class="hint-container" onclick="unlockHint()">
                <div class="hint-overlay" id="hint-overlay">
                    <span>🔒 點擊解鎖提示（防雷遮擋）</span>
                </div>
                <p id="hint-text" class="text-gray-200 text-sm md:text-base leading-relaxed opacity-0 transition-opacity duration-700">載入中...</p>
            </div>
        </div>
        
        <div class="flex flex-col sm:flex-row justify-center items-center gap-3 mb-5">
            <div class="input-row-group">
                <input type="text" id="answer-input" class="input-box" maxlength="4" placeholder="輸入成語" autocomplete="off">
                <button id="zy-toggle-btn" type="button" title="開啟注音小鍵盤" onclick="openZyKeypad()">⌨️</button>
            </div>
            <button id="submit-btn" class="bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-lg hover:shadow-cyan-500/40 w-full sm:w-auto">
                解謎驗證
            </button>
        </div>
        <p class="text-xs text-gray-500 -mt-3 mb-4">💡 可直接用手機／電腦的鍵盤輸入，或點擊 ⌨️ 開啟注音小鍵盤</p>

        <p id="message" class="text-xl font-bold min-h-[32px] mb-4"></p>

        <button id="next-btn" class="text-sm text-gray-400 hover:text-white underline decoration-dashed underline-offset-4 transition-colors">
            ⏭️ 隨機抽一題自由練習
        </button>
    </div>

    <!-- 內建注音輸入小鍵盤 -->
    <div id="zy-keypad" class="zy-keypad hidden">
        <div class="zy-candidates" id="zy-candidates">
            <span class="zy-buffer">請輸入注音符號...</span>
        </div>
        <div class="zy-grid" id="zy-grid"></div>
        <div class="zy-toolbar">
            <button class="zy-fn-btn" onclick="clearZyBuffer()">清除注音</button>
            <button class="zy-fn-btn" onclick="backspaceAnswer()">⌫ 刪字</button>
            <button class="zy-fn-btn" onclick="closeZyKeypad()">收合鍵盤 ⌄</button>
        </div>
    </div>

    <!-- 記錄榜／月曆彈窗 -->
    <div id="calendar-modal" class="calendar-modal hidden">
        <div class="calendar-card">
            <div class="calendar-header">
                <button type="button" onclick="calShiftMonth(-1)">◀</button>
                <span id="calendar-month-label">1 月</span>
                <button type="button" onclick="calShiftMonth(1)">▶</button>
                <button type="button" class="calendar-close" onclick="closeCalendar()">✕</button>
            </div>
            <div class="calendar-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
            <div class="calendar-grid" id="calendar-grid"></div>
            <div class="calendar-legend">
                <span><span class="legend-dot done"></span>已破關</span>
                <span><span class="legend-dot today"></span>今天</span>
            </div>
            <p class="calendar-progress" id="calendar-progress"></p>
        </div>
    </div>

    <div class="app-footer">
        作者：郭柏宏 老師　｜　版本：20260909
    </div>


    <script>
        // ==========================================
        // 1. 音效系統：game.mp3 背景音樂 + 空間音效 (Web Audio API)
        // ==========================================
        let audioCtx, masterGain, delayNode, feedbackGain;
        let soundEnabled = false;   // 遊戲音效（開鎖、答對、答錯、轉動骰子...）
        let bgmEnabled = false;     // 背景音樂 game.mp3
        let masterVolume = 0.7;    // 0 ~ 1

        const bgmAudio = new Audio('game.mp3');
        bgmAudio.loop = true;
        bgmAudio.preload = 'auto';
        bgmAudio.volume = masterVolume;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.7 * masterVolume;

            delayNode = audioCtx.createDelay();
            delayNode.delayTime.value = 0.35;

            feedbackGain = audioCtx.createGain();
            feedbackGain.gain.value = 0.3;

            delayNode.connect(feedbackGain);
            feedbackGain.connect(delayNode);

            delayNode.connect(masterGain);
            masterGain.connect(audioCtx.destination);
        }

        function playTone(freq, type, attack, release, vol, useDelay = true) {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = type;
            osc.frequency.value = freq;

            osc.connect(gain);
            gain.connect(masterGain);
            if (useDelay) gain.connect(delayNode);

            const now = audioCtx.currentTime;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(vol, now + attack);
            gain.gain.exponentialRampToValueAtTime(0.001, now + attack + release);

            osc.start(now);
            osc.stop(now + attack + release + 0.1);
        }

        function playSynth(type) {
            if (!soundEnabled || !audioCtx) return;
            if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    setTimeout(() => playTone(freq, 'sine', 0.05, 1.5, 0.4, true), i * 100);
                    setTimeout(() => playTone(freq, 'triangle', 0.05, 1.0, 0.2, true), i * 100);
                });
            } else if (type === 'wrong') {
                playTone(120, 'sine', 0.01, 0.4, 0.6, false);
                playTone(80, 'triangle', 0.01, 0.3, 0.4, false);
            } else if (type === 'spin') {
                playTone(300 + Math.random()*100, 'triangle', 0.01, 0.05, 0.1, false);
            } else if (type === 'unlock') {
                playTone(440.00, 'sine', 0.1, 1.2, 0.3, true);
                playTone(659.25, 'sine', 0.1, 1.2, 0.2, true);
            } else if (type === 'click') {
                playTone(600, 'square', 0.005, 0.08, 0.15, false);
            } else if (type === 'key') {
                playTone(900, 'sine', 0.002, 0.04, 0.12, false);
            }
        }

        // ---- 音量 / 音樂 / 音效 / 全螢幕 設定 ----
        function applyVolume(v) {
            v = parseInt(v, 10);
            masterVolume = v / 100;
            bgmAudio.volume = bgmEnabled ? masterVolume : 0;
            if (masterGain) masterGain.gain.value = 0.7 * masterVolume;
            document.querySelectorAll('.volume-slider').forEach(el => el.value = v);
            document.querySelectorAll('.volume-label').forEach(el => el.textContent = v + '%');
        }

        function toggleBgm(on) {
            bgmEnabled = on;
            initAudio();
            if (on) {
                bgmAudio.volume = masterVolume;
                bgmAudio.play().catch(() => {});
            } else {
                bgmAudio.pause();
            }
            document.querySelectorAll('.bgm-toggle').forEach(el => el.checked = on);
            syncAudioIcon();
        }

        function toggleSfx(on) {
            soundEnabled = on;
            if (on) { initAudio(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
            document.querySelectorAll('.sfx-toggle').forEach(el => el.checked = on);
            syncAudioIcon();
        }

        function syncAudioIcon() {
            const on = bgmEnabled || soundEnabled;
            document.getElementById('audio-ctrl').innerText = on ? "🔊" : "🔇";
            document.getElementById('audio-ctrl').classList.toggle('bg-blue-500/30', on);
        }

        function toggleAudio() {
            const newState = !(bgmEnabled || soundEnabled);
            toggleBgm(newState);
            toggleSfx(newState);
            if (newState) playSynth('unlock');
        }
        document.getElementById('audio-ctrl').addEventListener('click', toggleAudio);

        function requestFS(el) {
            const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
            if (fn) return fn.call(el).catch(() => {});
        }
        function exitFS() {
            const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
            if (fn) return fn.call(document).catch(() => {});
        }
        function toggleFullscreen() {
            if (!document.fullscreenElement) requestFS(document.documentElement);
            else exitFS();
        }
        function updateFullscreenUI() {
            const isFs = !!document.fullscreenElement;
            document.querySelectorAll('.fullscreen-btn-label').forEach(el => el.textContent = isFs ? '🖥️ 退出全螢幕' : '🖥️ 進入全螢幕');
        }
        ['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange'].forEach(ev =>

        document.getElementById('start-btn').addEventListener('click', () => {

            const grid = document.getElementById('zy-grid');
            grid.innerHTML = '';
            ZY_KEYS.forEach(k => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'zy-key' + (ZY_TONES.includes(k) ? ' zy-tone' : '');
                btn.textContent = k;
                btn.onclick = () => onZyKey(k);
                grid.appendChild(btn);
            });

        function onZyKey(k) {
            playSynth('key');
            if (ZY_TONES.includes(k)) {
                // 聲調符號一律置於最後，且同一組只保留一個
                zyBuffer = zyBuffer.replace(/[ˊˇˋ˙]$/, '') + k;
            } else {
                // 若前面已經有聲調符號，代表要開始輸入下一個字了，重新開始
                if (/[ˊˇˋ˙]$/.test(zyBuffer)) zyBuffer = '';
                zyBuffer += k;
            }
            updateZyCandidates();
        }

        function updateZyCandidates() {
            const box = document.getElementById('zy-candidates');

            bufSpan.className = 'zy-buffer';
            bufSpan.textContent = zyBuffer || '請輸入注音符號...';
            box.appendChild(bufSpan);

            if (cands) {

                    b.type = 'button';

            updateZyCandidates();
            if (input.value.length >= 4) {

            const startWeekday = new Date(CAL_YEAR, calMonth - 1, 1).getDay();
            const realNow = new Date();
            const isRealMonth = (realNow.getMonth() + 1) === calMonth;

            for (let i = 0; i < startWeekday; i++) {
                grid.appendChild(document.createElement('div'));
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const doy = Math.round((new Date(CAL_YEAR, calMonth - 1, d) - new Date(CAL_YEAR, 0, 0)) / 86400000);
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'cal-day';
                btn.textContent = d;
                if (completedDays.has(doy)) btn.classList.add('done');
                if (isRealMonth && d === realNow.getDate()) btn.classList.add('today');
                btn.onclick = () => jumpToDay(doy);
                grid.appendChild(btn);
            }

            document.getElementById('calendar-progress').innerText = `已破關 ${completedDays.size} / ${DB.length} 天`;
        }

        function calShiftMonth(delta) {
            playSynth('click');
            calMonth += delta;
            if (calMonth < 1) calMonth = 12;
            if (calMonth > 12) calMonth = 1;
            renderCalendar();
        }

        function jumpToDay(doy) {
            playSynth('click');
            closeCalendar();
            loadIdiom(true, doy);
        }

        function openCalendar() {
            playSynth('click');
            calMonth = new Date().getMonth() + 1;
            renderCalendar();
            document.getElementById('calendar-modal').classList.remove('hidden');
        }
        function closeCalendar() {
            playSynth('click');
            document.getElementById('calendar-modal').classList.add('hidden');
        }
        document.getElementById('record-btn').addEventListener('click', openCalendar);

        function lockHint() {
            const hintContainer = document.getElementById('hint-box');
            const hintText = document.getElementById('hint-text');
            hintContainer.classList.remove('unlocked');
            hintText.classList.replace('opacity-100', 'opacity-0');
        }

        window.unlockHint = function() {
            const hintContainer = document.getElementById('hint-box');
            if(!hintContainer.classList.contains('unlocked')) {
                hintContainer.classList.add('unlocked');
                document.getElementById('hint-text').classList.replace('opacity-0', 'opacity-100');
                playSynth('unlock');
            }
        }

        function loadIdiom(isDaily, forceDay) {
            let index, word, hintStr;
            if (isDaily) {
                const day = forceDay || getDayOfYear();
                currentChallengeDay = day;
                const { month, date } = doyToDate(day);
                document.getElementById('mode-badge').innerText = forceDay ? "📅 指定挑戰" : "📅 本日挑戰";
                document.getElementById('day-text').innerText = `第 ${day} 天（${month}月${date}日）`;
                index = (day - 1) % DB.length;
            } else {
                currentChallengeDay = null;
                document.getElementById('mode-badge').innerText = "🎲 自由模式";
                document.getElementById('day-text').innerText = "隨機練功";
                index = Math.floor(Math.random() * DB.length);
            }

            word = DB[index].w;
            hintStr = DB[index].h.replace(new RegExp(`[${word}]`, 'g'), "〇");

            // 每題的 12 個部件已於資料庫中預先拆解完成（真實部件、筆畫盡量平均分配）
            const parts = DB[index].p;
            currentIdiomData = { word, parts };

            document.getElementById('hint-text').innerHTML = hintStr;
            document.getElementById('answer-input').value = "";
            document.getElementById('message').innerText = "";
            document.getElementById('answer-input').focus();
            lockHint(); 

            const cube1Faces = document.querySelectorAll('#cube1 .face');
            const cube2Faces = document.querySelectorAll('#cube2 .face');
            for(let i=0; i<6; i++) {
                // 核心修復：加上 || "" 防呆，若陣列無法湊齊12個，則乾淨留白不顯示 undefined
                cube1Faces[i].innerText = parts[i] || "";
                cube2Faces[i].innerText = parts[i+6] || "";
            }

            document.getElementById('cube1').style.transform = `rotateX(-20deg) rotateY(20deg)`;
            document.getElementById('cube2').style.transform = `rotateX(-20deg) rotateY(-20deg)`;
        }

        document.getElementById('submit-btn').addEventListener('click', checkAnswer);
        document.getElementById('answer-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });

        function checkAnswer() {
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            const input = document.getElementById('answer-input').value.trim();
            const msgEl = document.getElementById('message');
            
            if (input === currentIdiomData.word) {
                msgEl.innerText = "🎉 答對了！字神降臨！";
                msgEl.className = "text-xl font-bold min-h-[32px] mb-4 text-emerald-400 drop-shadow-[0_0_10px_rgba(16,185,129,0.8)]";
                playSynth('win');
                if (currentChallengeDay) {
                    completedDays.add(currentChallengeDay);
                    saveProgress();
                    if (!document.getElementById('calendar-modal').classList.contains('hidden')) renderCalendar();
                }
            } else {
                msgEl.innerText = "❌ 答錯囉，點擊提示看看？";
                msgEl.className = "text-xl font-bold min-h-[32px] mb-4 text-rose-400 drop-shadow-[0_0_10px_rgba(244,63,94,0.8)]";
                playSynth('wrong');
            }
        }

        document.getElementById('next-btn').addEventListener('click', () => {
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            playSynth('click');
            loadIdiom(false);
        });

        // ==========================================
        // 5. 3D 骰子拖曳控制
        // ==========================================
        function enableDrag(cubeId) {
            const el = document.getElementById(cubeId);
            let isDragging = false;
            let startX, startY, currentX = -20, currentY = (cubeId === 'cube1' ? 20 : -20);
            let rotateX = currentX, rotateY = currentY;
            let lastPlayTime = 0;

            const start = (e) => {
                isDragging = true;
                startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                el.style.transition = 'none'; el.style.cursor = 'grabbing';
            };

            const move = (e) => {
                if (!isDragging) return;
                if (e.cancelable && e.type.includes('touch')) e.preventDefault();
                const cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                const cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                rotateY = currentY + (cx - startX) * 0.6;
                rotateX = currentX - (cy - startY) * 0.6;
                el.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

                const now = Date.now();
                if (now - lastPlayTime > 150) {
                    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                    playSynth('spin'); lastPlayTime = now;
                }
            };

            const end = () => {
                if (!isDragging) return;
                isDragging = false; 
                currentX = rotateX; currentY = rotateY;
                el.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
                el.style.cursor = 'grab';
            };

            el.addEventListener('mousedown', start); 
            window.addEventListener('mousemove', move); 
            window.addEventListener('mouseup', end);
            el.addEventListener('touchstart', start, {passive: false}); 
            window.addEventListener('touchmove', move, {passive: false}); 
            window.addEventListener('touchend', end);
        }

        enableDrag('cube1');
        enableDrag('cube2');
        updateTodayBadge();
        loadIdiom(true);

    </script>
</body>
</html>
